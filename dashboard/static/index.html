<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bench Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">pooria-bench</div>
    <label class="field">Run <select id="run-select" aria-label="Run"></select></label>
    <button id="refresh" type="button" title="Reload data (r)">Refresh</button>
    <label class="check"><input type="checkbox" id="auto-refresh"> Auto-refresh</label>
    <div id="run-meta" class="run-meta"></div>
  </header>

  <main class="layout">
    <section class="panel summary-panel">
      <h2>Models</h2>
      <div id="summary" class="table-wrap"></div>
    </section>
    <section class="col-left">
      <div class="panel">
        <div class="panel-head">
          <h2>Problems</h2>
          <div class="filters">
            <select id="filter-outcome" aria-label="Filter by outcome">
              <option value="all">All problems</option>
              <option value="anywrong">Any model not correct</option>
              <option value="disagree">Models disagree</option>
              <option value="allwrong">No model correct</option>
              <option value="issues">Errors, out of budget, refusals</option>
              <option value="nothink">Answered with no reasoning</option>
            </select>
            <select id="filter-category" aria-label="Filter by category"></select>
            <input id="filter-text" type="search" placeholder="Search id or text" aria-label="Search">
          </div>
        </div>
        <div id="matrix" class="table-wrap"></div>
        <p class="legend">
          <span class="v v-correct">✓</span> correct
          <span class="v v-wrong">✗</span> wrong
          <span class="v v-budget">✂</span> out of budget
          <span class="v v-refused">⊘</span> refused
          <span class="v v-error">!</span> error
          <span class="v v-pending">·</span> pending
          <span class="tag-mini">0r</span> no reasoning
        </p>
      </div>
    </section>

    <section class="col-right">
      <div id="detail" class="panel detail">
        <p class="muted">Select a problem. Use ← / → (or j / k) to step through.</p>
      </div>
    </section>
  </main>
</body>
</html>
